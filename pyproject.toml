[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomodels-cli"
version = "0.1.0"
description = "Command-line client for the BioModels REST API"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "BioModels CLI contributors" }
]
keywords = ["biomodels", "systems-biology", "cli", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://www.biomodels.org/"
Documentation = "https://www.biomodels.org/docs/"
Repository = "https://github.com/example/biomodels-cli"

[project.scripts]
biomodels = "biomodels_cli.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ARG"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_configs = true
packages = ["biomodels_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
